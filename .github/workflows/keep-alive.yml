name: Keep Cluster Alive

on:
  schedule:
    - cron: '0 */12 * * *'  # 每 12 小时
  workflow_dispatch:  # 支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node1 Health (scheduler co-located)
        run: |
          curl -sf https://scanli-blinkquant-node1.hf.space/api/v1/health
        continue-on-error: true
      - name: Ping Node2 Health
        run: |
          curl -sf https://scanli-blinkquant-node2.hf.space/api/v1/health
        continue-on-error: true
      - name: Ping Node3 Health
        run: |
          curl -sf https://scanli-blinkquant-node3.hf.space/api/v1/health
        continue-on-error: true