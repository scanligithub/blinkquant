name: P4.1 Production Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-production-acceptance.yml'
  workflow_run:
    workflows: ["Deploy Backend to HF Spaces"]
    types: [completed]

concurrency:
  group: p4.1-production-acceptance
  cancel-in-progress: true

jobs:
  restart-persistence:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployed Node1
        env:
          NODE1: https://scanli-blinkquant-node1.hf.space
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 15 "$NODE1/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"status":"healthy"'; then
              healthy=$((healthy+1))
              if [ "$healthy" -ge 3 ]; then break; fi
            else
              healthy=0
            fi
            sleep 10
          done
          [ "$healthy" -ge 3 ]

      - name: Create restart persistence probe
        env:
          NODE1: https://scanli-blinkquant-node1.hf.space
        run: |
          set -euo pipefail
          BASE="$NODE1/api/v1/backtest-strategy-templates"
          cat >/tmp/persist.json <<'JSON'
          {"name":"P4.1 restart persistence probe","description":"P4.1 restart persistence verification","config":{"strategy":{"universe":{"type":"all_a"},"entry":{"condition":"CLOSE > MA(CLOSE,20)","trigger":"condition","timeframe":"D"},"sizing":{"method":"top_n_equal_weight","max_positions":7},"rebalance":{"frequency":"weekly"},"mode":"target_portfolio"},"fee_policy":{"mode":"historical"},"benchmark":{"enabled":true,"type":"index","index_id":"000300"},"min_listing_days":42,"exclude_st":true}}
          JSON
          curl -fsS --max-time 20 -H 'Content-Type: application/json' -H 'X-User-Id: p41-restart-probe'             --data-binary @/tmp/persist.json "$BASE" | tee /tmp/create.out
          python - <<'PY'
          import json
          t=json.load(open('/tmp/create.out'))["template"]
          assert t["config"]["strategy"]["sizing"]["max_positions"]==7
          assert t["config"]["min_listing_days"]==42
          print("PROBE CREATED:", t["id"])
          open("/tmp/probe_id","w").write(str(t["id"]))
          PY

      - name: Restart Node1 and verify persistence
        env:
          NODE1: https://scanli-blinkquant-node1.hf.space
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          BASE="$NODE1/api/v1/backtest-strategy-templates"
          echo '--- Restart Node1 ---'
          curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $HF_TOKEN"             "https://huggingface.co/api/spaces/scanli/blinkquant-node1/restart"

          healthy=0
          for i in $(seq 1 90); do
            body=$(curl -fsS --max-time 15 "$NODE1/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"status":"healthy"'; then
              healthy=$((healthy+1))
              if [ "$healthy" -ge 3 ]; then break; fi
            else
              healthy=0
            fi
            sleep 10
          done
          [ "$healthy" -ge 3 ]

          echo '--- Verify probe after restart ---'
          curl -fsS --max-time 20 -H 'X-User-Id: p41-restart-probe' "$BASE" | tee /tmp/after.json
          python - <<'PY'
          import json
          tid=open('/tmp/probe_id').read().strip()
          rows=json.load(open('/tmp/after.json'))["templates"]
          found=[x for x in rows if str(x["id"])==tid]
          assert len(found)==1, rows
          t=found[0]
          assert t["config"]["strategy"]["sizing"]["max_positions"]==7
          assert t["config"]["strategy"]["rebalance"]["frequency"]=="weekly"
          assert t["config"]["benchmark"]["index_id"]=="000300"
          assert t["config"]["min_listing_days"]==42
          assert t["config"]["exclude_st"] is True
          print("P4.1 SQLITE RESTART PERSISTENCE OK")
          PY

          ID=$(cat /tmp/probe_id)
          curl -fsS --max-time 20 -X DELETE -H 'X-User-Id: p41-restart-probe' "$BASE?id=$ID"
          echo "P4.1 PRODUCTION RESTART PERSISTENCE OK"
