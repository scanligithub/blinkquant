name: Deploy Backend to HF Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:


concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 定义三个节点和对应的 Space 名称
        node: [1, 2, 3]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to HF Space Node ${{ matrix.node }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. 进入后端目录，并写入本次源代码提交 SHA，供节点 health 追溯
          cd backend
          printf '%s\n' "$GITHUB_SHA" > .build_git_sha
          
          # 2. 初始化临时 Git 仓库
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # 3. 添加所有文件
          git add .
          git commit -m "Deploy Node ${{ matrix.node }}"
          
          # 4. 强制推送到对应的 HF Space
          # 注意：这里的 URL 拼接了你的 HF 用户名 scanli 和 Space 名称
          git push -f https://scanli:$HF_TOKEN@huggingface.co/spaces/scanli/blinkquant-node${{ matrix.node }} master:main

      - name: Wait for Node ${{ matrix.node }} deployment readiness
        env:
          NODE: https://scanli-blinkquant-node${{ matrix.node }}.hf.space
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          healthy_count=0
          for i in $(seq 1 90); do
            body=$(curl -fsS --max-time 20 "$NODE/api/v1/status" || true)
            echo "$body"
            matched=$(BODY="$body" EXPECTED_SHA="$EXPECTED_SHA" python - <<'PY'
          import json, os
          try:
              body = json.loads(os.environ.get("BODY", ""))
          except Exception:
              print("0")
              raise SystemExit
          print("1" if body.get("status") == "healthy" and body.get("git_sha") == os.environ["EXPECTED_SHA"] else "0")
          PY
            )
            if [ "$matched" = "1" ]; then
              healthy_count=$((healthy_count + 1))
              if [ "$healthy_count" -ge 3 ]; then
                echo "Node deployment ready at $EXPECTED_SHA"
                exit 0
              fi
            else
              healthy_count=0
            fi
            sleep 10
          done
          echo "Node ${{ matrix.node }} did not become healthy on $EXPECTED_SHA" >&2
          exit 1
