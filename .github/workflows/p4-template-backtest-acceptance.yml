name: P4.1 Template To Backtest Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p4-template-backtest-acceptance.yml'

concurrency:
  group: p4.1-template-backtest
  cancel-in-progress: true

jobs:
  template-to-backtest:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Wait for Node1
        env:
          NODE1: https://scanli-blinkquant-node1.hf.space
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 60); do
            body=$(curl -fsS --max-time 15 "$NODE1/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"status":"healthy"'; then
              healthy=$((healthy+1))
              if [ "$healthy" -ge 3 ]; then break; fi
            else
              healthy=0
            fi
            sleep 10
          done
          [ "$healthy" -ge 3 ]

      - name: Authenticated template -> real backtest
        if: ${{ env.E2E_EMAIL != '' && env.E2E_PASSWORD != '' }}
        env:
          WEB: https://blinkquant.de5.net
          NODE1: https://scanli-blinkquant-node1.hf.space
        run: |
          set -euo pipefail
          rm -f /tmp/cookies.txt
          python - <<'PY' >/tmp/login.json
          import json, os
          print(json.dumps({
              "email": os.environ["E2E_EMAIL"],
              "password": os.environ["E2E_PASSWORD"],
          }))
          PY
          curl -fsS --max-time 20 -c /tmp/cookies.txt             -H 'Content-Type: application/json'             --data-binary @/tmp/login.json "$WEB/api/auth/login" >/tmp/login.out

          BASE="$WEB/api/backtest-strategy-templates"
          cat >/tmp/template.json <<'JSON'
          {"name":"P4.1 template-to-backtest","description":"P4.1 authenticated apply acceptance","config":{"strategy":{"universe":{"type":"all_a"},"entry":{"condition":"CLOSE > MA(CLOSE,20)","trigger":"condition","timeframe":"D"},"sizing":{"method":"top_n_equal_weight","max_positions":5},"rebalance":{"frequency":"weekly"},"mode":"target_portfolio"},"fee_policy":{"mode":"historical"},"benchmark":{"enabled":true,"type":"index","index_id":"000300"},"min_listing_days":30,"exclude_st":true}}
          JSON

          curl -fsS --max-time 20 -b /tmp/cookies.txt             -H 'Content-Type: application/json'             --data-binary @/tmp/template.json "$BASE" | tee /tmp/template-create.json

          python - <<'PY'
          import json
          t=json.load(open('/tmp/template-create.json'))["template"]
          assert t["config"]["strategy"]["sizing"]["max_positions"] == 5
          assert t["config"]["strategy"]["rebalance"]["frequency"] == "weekly"
          assert t["config"]["benchmark"]["index_id"] == "000300"
          open("/tmp/template-config.json","w").write(json.dumps(t["config"]))
          open("/tmp/template-id","w").write(str(t["id"]))
          PY

          curl -fsS --max-time 20 -b /tmp/cookies.txt "$BASE" | tee /tmp/template-list.json
          python - <<'PY'
          import json
          tid=open('/tmp/template-id').read().strip()
          rows=json.load(open('/tmp/template-list.json'))["templates"]
          assert any(str(x["id"])==tid for x in rows)
          print("AUTHENTICATED TEMPLATE READ OK")
          PY

          python - <<'PY'
          import json
          cfg=json.load(open('/tmp/template-config.json'))
          req={
            "start_date":"2024-01-02",
            "end_signal_date":"2024-03-29",
            "initial_cash":1000000,
            "fee_policy":cfg["fee_policy"],
            "benchmark":cfg["benchmark"],
            "min_listing_days":cfg["min_listing_days"],
            "exclude_st":cfg["exclude_st"],
            "strategy":cfg["strategy"],
          }
          with open("/tmp/backtest.json","w") as f:
            json.dump(req,f)
          PY

          curl -fsS --max-time 30 -H 'Content-Type: application/json'             --data-binary @/tmp/backtest.json "$NODE1/api/v1/backtest/async" | tee /tmp/submit.json
          python - <<'PY'
          import json
          open('/tmp/job_id','w').write(json.load(open('/tmp/submit.json'))["job_id"])
          PY

          JOB=$(cat /tmp/job_id)
          for i in $(seq 1 180); do
            body=$(curl -fsS --max-time 20 "$NODE1/api/v1/backtest/async/$JOB")
            echo "$body" >/tmp/result.json
            status=$(echo "$body" | python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            echo "poll=$i status=$status"
            if [ "$status" = "done" ]; then break; fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              cat /tmp/result.json
              exit 1
            fi
            sleep 10
          done

          python - <<'PY'
          import json
          r=json.load(open('/tmp/result.json'))
          assert r["status"]=="done", r
          cfg=r["meta"]["backtest_config"]
          saved=json.load(open('/tmp/template-config.json'))
          assert cfg["strategy"]["universe"] == saved["strategy"]["universe"]
          assert cfg["strategy"]["entry"] == saved["strategy"]["entry"]
          assert cfg["strategy"].get("exit") == saved["strategy"].get("exit")
          assert cfg["strategy"]["sizing"] == saved["strategy"]["sizing"]
          assert cfg["strategy"]["rebalance"] == saved["strategy"]["rebalance"]
          assert cfg["strategy"]["mode"] == saved["strategy"]["mode"]
          assert cfg["fee_policy"]["mode"] == saved["fee_policy"]["mode"]
          assert cfg["benchmark"]["enabled"] == saved["benchmark"]["enabled"]
          assert cfg["benchmark"]["index_id"] == saved["benchmark"]["index_id"]
          assert cfg["min_listing_days"] == saved["min_listing_days"]
          assert cfg["exclude_st"] == saved["exclude_st"]
          assert r["summary"]["n_trades"] > 0, r["summary"]
          assert r["summary"]["final_equity"] > 0, r["summary"]
          print("P4.1 AUTHENTICATED TEMPLATE -> REAL BACKTEST APPLY OK")
          PY

          ID=$(cat /tmp/template-id)
          curl -fsS --max-time 20 -X DELETE -b /tmp/cookies.txt "$BASE?id=$ID"
          echo "P4.1 TEMPLATE CLEANUP OK"

      - name: Note authenticated production test status
        if: ${{ env.E2E_EMAIL == '' || env.E2E_PASSWORD == '' }}
        run: |
          echo "Authenticated template -> backtest production E2E skipped: GitHub secrets E2E_EMAIL/E2E_PASSWORD are not configured."
          echo "The last fully authenticated production template -> real backtest acceptance passed before the security boundary change; this workflow will run it automatically once E2E secrets are configured."
