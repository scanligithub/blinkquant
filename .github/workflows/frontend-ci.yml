name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: IA5.4.1 watchlist contract regression
        run: node tests/watchlists-contract.test.mjs
      - name: IA5.4.2 watchlist backtest universe regression
        run: node tests/watchlists-contract.test.mjs
      - name: IA4 route and navigation regression
        run: node scripts/check-ia4-routes.mjs
      - run: npm run build
